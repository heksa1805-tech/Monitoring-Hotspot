<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA FIRMS Hotspot Monitor</title>
    <!-- Tailwind CSS untuk Desain Antarmuka -->
    <script src="https://jsdelivr.net"></script>
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        #map { height: calc(100vh - 80px); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans overflow-hidden">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 h-20 px-6 flex items-center justify-between border-b border-gray-700 shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🔥</span>
            <h1 class="text-xl font-bold tracking-wide">NASA FIRMS Hotspot Monitor</h1>
        </div>
        <!-- Input MAP_KEY oleh Pengguna (Aman, tidak bocor di kode GitHub) -->
        <div class="flex items-center space-x-2">
            <input type="password" id="apiKeyInput" placeholder="Masukkan MAP_KEY NASA" class="bg-gray-700 text-sm rounded px-3 py-2 border border-gray-600 focus:outline-none focus:border-red-500 w-64">
            <button onclick="fetchHotspotData()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded transition shadow">
                Muat Data
            </button>
        </div>
    </header>

    <!-- Area Konten Utama -->
    <main class="relative">
        <!-- Peta Interaktif -->
        <div id="map" class="w-full"></div>

        <!-- Indikator Loading & Status -->
        <div id="statusAlert" class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] bg-gray-800 border border-red-500 text-red-400 px-4 py-2 rounded shadow-lg text-sm font-medium">
            Memuat data hotspot...
        </div>
    </main>

    <!-- Leaflet JS untuk Peta -->
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Inisialisasi Peta Leaflet (Fokus default di wilayah Indonesia)
        const map = L.map('map').setView([-0.7893, 113.9213], 5);

        // Menggunakan peta dasar OpenStreetMap gelap (cartodb-darkmatter) agar kontras dengan titik api
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors &copy; <a href="https://carto.com">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Layer Group untuk menampung titik hotspot agar bisa dibersihkan saat refresh
        let hotspotLayer = L.layerGroup().addTo(map);

        // Fungsi utama untuk mengambil data dari API NASA FIRMS
        async function fetchHotspotData() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const statusAlert = document.getElementById('statusAlert');

            if (!apiKey) {
                alert('Silakan masukkan MAP_KEY NASA FIRMS Anda terlebih dahulu.');
                return;
            }

            // Tampilkan indikator loading
            statusAlert.innerText = "Sedang mengambil data hotspot terkini...";
            statusAlert.classList.remove('hidden');
            hotspotLayer.clearLayers();

            // Parameter API (Contoh: Satelit VIIRS SNPP, Negara Indonesia [IDN], Data 1 hari terakhir)
            const satellite = 'VIIRS_SNPP';
            const countryCode = 'IDN';
            const days = '1';
            const url = `https://nasa.gov{apiKey}/${satellite}/${countryCode}/${days}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Gagal terhubung ke API. Periksa kembali MAP_KEY Anda.');

                const csvText = await response.text();
                processCSVData(csvText);
                
                statusAlert.classList.add('hidden');
            } catch (error) {
                statusAlert.innerText = error.message;
                setTimeout(() => statusAlert.classList.add('hidden'), 5000);
            }
        }

        // Fungsi untuk memproses teks CSV dari NASA menjadi format koordinat di peta
        function processCSVData(csvText) {
            const lines = csvText.split('\n');
            if (lines.length <= 1) return;

            // Ambil header kolom untuk indeks
            const headers = lines[0].split(',');
            const latIndex = headers.indexOf('latitude');
            const lngIndex = headers.indexOf('longitude');
            const confIndex = headers.indexOf('confidence');
            const brightIndex = headers.indexOf('brightness');
            const dateIndex = headers.indexOf('acq_date');
            const timeIndex = headers.indexOf('acq_time');

            let count = 0;

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                const columns = lines[i].split(',');

                const lat = parseFloat(columns[latIndex]);
                const lng = parseFloat(columns[lngIndex]);
                const confidence = columns[confIndex]; // 'h' (high), 'n' (nominal), 'l' (low)
                const brightness = columns[brightIndex];
                const date = columns[dateIndex];
                const time = columns[timeIndex];

                // Tentukan warna marker berdasarkan tingkat confidence/keyakinan satelit
                let markerColor = '#f59e0b'; // Jingga untuk nominal
                if (confidence === 'h') markerColor = '#ef4444'; // Merah untuk tingkat tinggi
                if (confidence === 'l') markerColor = '#eab308'; // Kuning untuk tingkat rendah

                // Buat lingkaran penanda (CircleMarker) di peta
                const marker = L.circleMarker([lat, lng], {
                    radius: 6,
                    fillColor: markerColor,
                    color: '#ffffff',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                });

                // Konten balon informasi (Popup) saat titik diklik
                const popupContent = `
                    <div class="text-gray-900 font-sans text-xs">
                        <strong class="text-sm block border-b pb-1 mb-1 text-red-600">Hotspot Terdeteksi</strong>
                        <b>Waktu:</b> ${date} ${time} UTC<br>
                        <b>Kecerahan:</b> ${brightness} K<br>
                        <b>Tingkat Keyakinan:</b> ${confidence === 'h' ? 'Tinggi' : confidence === 'n' ? 'Nominal' : 'Rendah'}<br>
                        <b>Koordinat:</b> ${lat}, ${lng}
                    </div>
                `;
                marker.bindPopup(popupContent);
                hotspotLayer.addLayer(marker);
                count++;
            }

            alert(`Berhasil memuat ${count} titik hotspot di Indonesia.`);
        }
    </script>
</body>
</html>
